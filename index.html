<script>
  // le reste est caché pendant l'entrée, sinon la page clignote
  document.body.classList.add("porte");

  // heure en Asie : si le téléphone y est déjà (UTC+5 à +9) c'est la sienne, sinon celle de Bangkok (UTC+7)
  function heureEnAsie(d) {
    const decal = -d.getTimezoneOffset() / 60;
    if (decal >= 5 && decal <= 9) return d.getHours() + d.getMinutes() / 60;
    return (d.getUTCHours() + d.getUTCMinutes() / 60 + 7) % 24;
  }

  // 0 en pleine nuit, 1 en plein jour. lever vers 6h, coucher vers 18h, avec une heure de transition
  function niveauDuJour(h) {
    const palier = (a, b) => {
      const x = Math.min(1, Math.max(0, (h - a) / (b - a)));
      return x * x * (3 - 2 * x);
    };
    return palier(5.6, 6.8) - palier(17.4, 18.6);
  }

  // pour que la première image ait déjà les bonnes couleurs
  (function () {
    const j = niveauDuJour(heureEnAsie(new Date()));
    document.documentElement.style.setProperty("--jour", j.toFixed(3));
    document.documentElement.classList.toggle("jour", j >= 0.6);
    document.documentElement.classList.toggle("nuit", j <= 0.4);
  })();
</script>
