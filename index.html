<div class="embers" id="embers"></div>

<header>
  <svg class="lanterns" id="lanterns" viewBox="0 0 360 96"></svg>
  <h1>Pour Sandy<span class="orn"><i></i><svg viewBox="0 0 24 24"><defs><radialGradient id="ornGlow"><stop offset="0" stop-color="#ffb35c" stop-opacity=".55"/><stop offset="1" stop-color="#ffb35c" stop-opacity="0"/></radialGradient></defs><circle cx="12" cy="12" r="12" fill="url(#ornGlow)"/><path d="M12 3.5 C12.6 9 15 11.4 20.5 12 C15 12.6 12.6 15 12 20.5 C11.4 15 9 12.6 3.5 12 C9 11.4 11.4 9 12 3.5 Z" fill="#ffd49a"/></svg><i></i></span></h1>
  <p class="intro">Avec ton impatience, t'aurais ouvert toutes les enveloppes d'un coup. Alors voilà cinq lettres pour tes deux mois en Asie, et chacune s'ouvre le jour prévu. Pas avant, j'ai vérifié.</p>
  <div class="count">
    <button class="waiting" id="waiting" hidden></button>
    <p class="count-label" id="countLabel"></p>
    <div class="boxes" id="boxes"></div>
  </div>
  <div class="trip">
    <svg class="route" id="route" viewBox="0 0 320 64"></svg>
    <p class="trip-label" id="tripLabel"></p>
  </div>
  <button class="sound" id="sound"></button>
</header>
